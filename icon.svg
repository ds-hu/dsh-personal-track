<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Personal Track">
  <!-- Original artwork: the board's own completion ring, three quarters full, over a day tile. -->
  <defs>
    <linearGradient id="pt-tile" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#14243D"/>
      <stop offset="0.55" stop-color="#1E3A5F"/>
      <stop offset="1" stop-color="#2E6BE6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#pt-tile)"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#2C4A72" stroke-width="6"/>
  <circle cx="32" cy="32" r="17" fill="none" stroke="#4ADE80" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="80 27" transform="rotate(-90 32 32)"/>
  <path d="M24.5 32.5 30 38l10-11" fill="none" stroke="#FFFFFF" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
